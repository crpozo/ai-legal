<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Legal · Seguimiento judicial con IA</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" hidden>
    <aside class="login-arte">
      <video class="login-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1" poster="https://images.pexels.com/videos/8731388/pexels-photo-8731388.jpeg?w=1280">
        <source src="https://videos.pexels.com/video-files/8731388/8731388-hd_1280_720_25fps.mp4" type="video/mp4">
      </video>
      <div>
        <span class="login-sello">IA como servicio</span>
        <h2>Legal Agents AI</h2>
        <p>Agentes de IA que automatizan el portal de la Función Judicial, leen cada actuación y te avisan qué requiere tu atención.</p>
      </div>
      <small>AI Legal</small>
    </aside>
    <form id="form-login" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="tenue">Ingresa con tu cuenta del estudio.</p>
      <label>Correo electrónico<input id="login-correo" type="email" autocomplete="username" placeholder="nombre@tuestudio.ec" required></label>
      <label>Contraseña<input id="login-clave" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <p id="login-error" role="alert"></p>
      <button type="submit">Ingresar</button>
    </form>
  </div>
  <div class="area">
      <header class="superior">
        <a class="marca" href="#buscar">
          <b class="nombre"><span>AI</span> Legal</b><small>Seguimiento judicial con IA</small>
        </a>
        <nav id="pestanas" role="tablist" aria-label="Secciones"></nav>
        <form id="buscar-top" role="search">
          <label class="campo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q-top" type="search" autocomplete="off" aria-label="Buscar causa, parte o juez" placeholder="Buscar causa, parte o juez…"></label>
          <button type="submit">Buscar</button>
        </form>
        <div class="usuario"><span id="usuario-inicial" aria-hidden="true">M</span><button type="button" id="salir">Salir</button></div>
      </header>
      <main id="contenido"><p class="vacio">Cargando…</p></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
