<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomos · Seguimiento judicial con IA</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta name="theme-color" content="#e8e0d4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=GFS+Didot&family=Outfit:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=tomos2">
</head>
<body>
  <div id="login" hidden>
    <aside class="login-arte" style="position:relative;overflow:hidden;isolation:isolate">
      <video class="login-video" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1" poster="https://images.pexels.com/videos/8731388/pexels-photo-8731388.jpeg?w=1280">
        <source src="https://videos.pexels.com/video-files/8731388/8731388-hd_1280_720_25fps.mp4" type="video/mp4">
      </video>
      <div>
        <span class="login-sello">IA como servicio</span>
        <h2>Tomos</h2>
        <p>Agentes de IA que automatizan el portal de la Función Judicial, leen cada actuación y te avisan qué requiere tu atención.</p>
      </div>
      <small>Tomos</small>
      <span class="greca-esq sup" aria-hidden="true"></span><span class="greca-esq inf" aria-hidden="true"></span>
    </aside>
    <form id="form-login" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="tenue">Ingresa con tu cuenta del estudio.</p>
      <label>Correo electrónico<input id="login-correo" type="email" autocomplete="username" placeholder="nombre@tuestudio.ec" required></label>
      <label>Contraseña<input id="login-clave" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <p id="login-error" role="alert"></p>
      <button type="submit">Ingresar</button>
    </form>
  </div>
  <div class="area">
      <header class="superior">
        <a class="marca" href="#buscar">
          <svg class="emblema" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 10.5h26M9 13.5h22M12 13.5v17M17.3 13.5v17M22.7 13.5v17M28 13.5v17M9 30.5h22M7 33.5h26"/><circle cx="9" cy="9" r="2.6"/><circle cx="31" cy="9" r="2.6"/></svg>
          <b class="nombre">Tomos</b><small>Seguimiento judicial con IA</small>
        </a>
        <nav id="pestanas" role="tablist" aria-label="Secciones"></nav>
        <form id="buscar-top" role="search">
          <label class="campo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q-top" type="search" autocomplete="off" aria-label="Buscar causa, parte o juez" placeholder="Buscar causa, parte o juez…"></label>
          <button type="submit">Buscar</button>
        </form>
        <div class="usuario"><span id="usuario-inicial" aria-hidden="true">M</span><button type="button" id="salir">Salir</button></div>
      </header>
      <main id="contenido"><p class="vacio">Cargando…</p></main>
  </div>
  <script type="module" src="app.js?v=tomos2"></script>
</body>
</html>
