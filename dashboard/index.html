<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio Maya · Seguimiento judicial con IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" hidden>
    <aside class="login-arte">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25V8l11 11L27 8v17" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h2>Legal Agents AI</h2>
        <p>Agentes de IA que revisan el portal de la Función Judicial, leen cada actuación y te avisan qué requiere tu atención.</p>
      </div>
      <small>Estudio Jurídico Maya</small>
    </aside>
    <form id="form-login" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="tenue">Ingresa con tu cuenta del estudio.</p>
      <label>Correo electrónico<input id="login-correo" type="email" autocomplete="username" placeholder="nombre@estudiomaya.ec" required></label>
      <label>Contraseña<input id="login-clave" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <p id="login-error" role="alert"></p>
      <button type="submit">Ingresar</button>
    </form>
  </div>
  <div class="area">
      <header class="superior">
        <a class="marca" href="#buscar">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25V8l11 11L27 8v17" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <b>Maya</b><small>Seguimiento judicial con IA</small>
        </a>
        <nav id="pestanas" role="tablist" aria-label="Secciones"></nav>
        <form id="buscar-top" role="search">
          <label class="campo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q-top" type="search" autocomplete="off" aria-label="Buscar causa, parte o juez" placeholder="Buscar causa, parte o juez…"></label>
          <button type="submit">Buscar</button>
        </form>
        <div class="usuario"><span id="usuario-inicial" aria-hidden="true">M</span><button type="button" id="salir">Salir</button></div>
      </header>
      <main id="contenido"><p class="vacio">Cargando…</p></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
